version: '3.8'
services:
  api:
    build: .
    ports:
      - '8000:8000'
  ui:
    image: streamlit/streamlit:latest
    ports:
      - '8501:8501'
    volumes:
      - ./:/app
    command: streamlit run /app/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    depends_on:
      - api
